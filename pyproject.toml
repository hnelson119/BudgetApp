[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "household-budget"
version = "0.1.0"
description = "Private, paycheck-anchored household budgeting application"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography==50.0.0",
  "Django==5.2.17",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "qrcode==8.2",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "coverage[toml]>=7.6,<8",
  "detect-secrets>=1.5,<2",
  "django-stubs>=5.2,<6",
  "mypy>=1.14,<2",
  "pip-audit>=2.9,<4",
  "pytest>=9.0.3,<10",
  "pytest-django>=4.10,<5",
  "ruff>=0.9,<1",
  "types-qrcode==8.2.0.20260518",
]

[tool.setuptools.packages.find]
include = [
  "audit*",
  "budgets*",
  "config*",
  "core*",
  "debts*",
  "goals*",
  "households*",
  "identity*",
  "imports*",
  "ledger*",
  "notifications*",
  "periods*",
  "reserves*",
  "schedules*",
  "spending*",
]

[tool.setuptools.package-data]
audit = ["templates/audit/*.html"]
core = ["templates/core/*.html", "static/core/*"]
budgets = ["templates/budgets/*.html", "templatetags/*.py"]
debts = ["templates/debts/*.html"]
goals = ["templates/goals/*.html"]
identity = ["templates/identity/*.html"]
imports = ["templates/imports/*.html"]
notifications = ["templates/notifications/*.html"]
spending = ["templates/spending/*.html"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --basetemp=.pytest-tmp"

[tool.coverage.run]
branch = true
omit = ["*/migrations/*"]
source = [
  "audit",
  "budgets",
  "core",
  "debts",
  "goals",
  "households",
  "identity",
  "imports",
  "ledger",
  "notifications",
  "periods",
  "reserves",
  "schedules",
  "spending",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "RUF"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "RUF012"]
"*/models.py" = ["RUF012"]
"deploy/pentest/run-authz-csrf.py" = ["E402"]
"deploy/pentest/run-session-security.py" = ["E402"]
"deploy/pentest/run-csv-security.py" = ["E402"]
"deploy/pentest/run-financial-logic.py" = ["E402"]
"deploy/pentest/run-audit-integrity.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
