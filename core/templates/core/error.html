{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>{{ status }} · Household Budget</title>
    <link rel="stylesheet" href="{% static 'core/app.css' %}">
  </head>
  <body>
    <main class="shell error-shell">
      <section class="error-card">
        <p class="eyebrow">Error {{ status }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <p class="error-reference">
          Reference: <code>{{ error_reference }}</code>
        </p>
        <a class="home-link" href="{% url 'core:home' %}">Return to the dashboard</a>
      </section>
    </main>
    <script src="{% static 'core/app.js' %}" defer></script>
  </body>
</html>
