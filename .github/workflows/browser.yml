name: Browser security and compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    name: Chromium, Firefox, and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run the isolated browser release checks
        run: sh scripts/run-browser-tests.sh
