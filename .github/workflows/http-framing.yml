name: Production HTTP framing boundary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-framing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framing-boundary:
    name: nginx and Gunicorn request boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run production-derived HTTP framing checks
        run: sh scripts/run-network-boundary.sh
