name: Upgrade and rollback rehearsal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-rehearsal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-rehearsal:
    name: Forward upgrade and clean-database rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run the isolated production-path upgrade rehearsal
        run: sh scripts/run-upgrade-rehearsal.sh
