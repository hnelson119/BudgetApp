name: Quality and security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python, Django, and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BUDGET_SECRET_DIR: /tmp/household-budget-ci-secrets
      BUDGET_BACKUP_REPOSITORY: /tmp/household-budget-ci-backups
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost,https://127.0.0.1

    steps:
      - name: Check out the source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the supported Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.lock
          .venv/bin/python -m pip install --no-deps --editable .

      - name: Run application quality and security checks
        run: sh scripts/check.sh

      - name: Audit the locked dependency set
        run: >-
          .venv/bin/python -m pip_audit --requirement requirements-dev.lock
          --cache-dir .pip-audit-cache --no-deps --disable-pip --strict

      - name: Validate every Compose profile without starting services
        run: docker compose --profile maintenance --profile recovery config --quiet

  container-security:
    name: Release image vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build the release image without runtime secrets
        run: docker build --tag household-budget:${{ github.sha }} .

      - name: Fail on high or critical release-image vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1
          --no-progress --skip-version-check household-budget:${{ github.sha }}
