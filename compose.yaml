x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS}
  DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/New_York}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
  APP_RELEASE: ${APP_RELEASE:-development}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-60}
  CSV_IMPORT_STAGING_RETENTION_HOURS: ${CSV_IMPORT_STAGING_RETENTION_HOURS:-24}
  POSTGRES_DB: ${POSTGRES_DB:-household_budget}
  POSTGRES_SSL_ROOT_CERTIFICATE_FILE: /run/secrets/postgres_ca_certificate
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /run/secrets/postgres_ca_certificate
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  DJANGO_MFA_ENCRYPTION_KEY_FILE: /run/secrets/django_mfa_encryption_key
  DJANGO_MFA_ENCRYPTION_KEY_VERSION: ${DJANGO_MFA_ENCRYPTION_KEY_VERSION:-1}

x-app-hardening: &app-hardening
  user: "10001:10001"
  group_add:
    - ${BUDGET_SECRET_GID:-10002}
  read_only: true
  init: true
  pids_limit: 128
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

x-log-policy: &log-policy
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    entrypoint: ["/bin/sh", "/usr/local/bin/start-postgres-tls.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-household_budget}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-budget_admin}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-budget_admin}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-budget_runtime}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-budget_migration}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-budget_backup}
      POSTGRES_AUDIT_USER: ${POSTGRES_AUDIT_USER:-budget_audit}
      POSTGRES_HOST_AUTH_METHOD: trust
    secrets:
      - postgres_client_ca_certificate
      - postgres_server_certificate
      - postgres_server_private_key
    group_add:
      - ${BUDGET_SECRET_GID:-10002}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/start-tls.sh:/usr/local/bin/start-postgres-tls.sh:ro
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    tmpfs:
      - /run/postgresql-tls:rw,noexec,nosuid,nodev,size=1m,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    logging: *log-policy

  db-bootstrap:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["maintenance"]
    entrypoint: ["/bin/sh", "/usr/local/bin/bootstrap-roles.sh"]
    environment:
      APP_ENVIRONMENT: production
      DATABASE_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-household_budget}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-budget_admin}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-budget_runtime}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-budget_migration}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-budget_backup}
      POSTGRES_AUDIT_USER: ${POSTGRES_AUDIT_USER:-budget_audit}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca_certificate
      PGSSLCERT: /run/secrets/postgres_db_bootstrap_client_certificate
      PGSSLKEY: /run/secrets/postgres_db_bootstrap_client_private_key
    secrets:
      - postgres_ca_certificate
      - postgres_db_bootstrap_client_certificate
      - postgres_db_bootstrap_client_private_key
    volumes:
      - ./deploy/postgres/bootstrap-roles.sh:/usr/local/bin/bootstrap-roles.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    user: postgres
    group_add:
      - ${BUDGET_SECRET_GID:-10002}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging: *log-policy

  migrate:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
    profiles: ["maintenance"]
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *app-environment
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-budget_migration}
      POSTGRES_SSL_CLIENT_CERTIFICATE_FILE: /run/secrets/postgres_migrate_client_certificate
      POSTGRES_SSL_CLIENT_PRIVATE_KEY_FILE: /run/secrets/postgres_migrate_client_private_key
      PGSSLCERT: /run/secrets/postgres_migrate_client_certificate
      PGSSLKEY: /run/secrets/postgres_migrate_client_private_key
    secrets:
      - django_secret_key
      - django_mfa_encryption_key
      - postgres_ca_certificate
      - postgres_migrate_client_certificate
      - postgres_migrate_client_private_key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    <<: *app-hardening
    logging: *log-policy

  mfa-key-rotate:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
    profiles: ["maintenance"]
    command:
      - python
      - manage.py
      - rotate_mfa_encryption_key
      - --new-version
      - ${BUDGET_MFA_NEXT_KEY_VERSION:-2}
      - --reason
      - ${BUDGET_MFA_ROTATION_REASON:-Scheduled cryptographic maintenance}
      - --confirm
      - rotate-to-v${BUDGET_MFA_NEXT_KEY_VERSION:-2}
    environment:
      <<: *app-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:-budget_runtime}
      POSTGRES_SSL_CLIENT_CERTIFICATE_FILE: /run/secrets/postgres_mfa_key_rotate_client_certificate
      POSTGRES_SSL_CLIENT_PRIVATE_KEY_FILE: /run/secrets/postgres_mfa_key_rotate_client_private_key
      PGSSLCERT: /run/secrets/postgres_mfa_key_rotate_client_certificate
      PGSSLKEY: /run/secrets/postgres_mfa_key_rotate_client_private_key
      DJANGO_MFA_ENCRYPTION_KEY_NEXT_FILE: /run/secrets/django_mfa_encryption_key_next
    secrets:
      - django_secret_key
      - django_mfa_encryption_key
      - django_mfa_encryption_key_next
      - postgres_ca_certificate
      - postgres_mfa_key_rotate_client_certificate
      - postgres_mfa_key_rotate_client_private_key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    <<: *app-hardening
    logging: *log-policy

  backup:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
      dockerfile: deploy/backup/Dockerfile
    profiles: ["maintenance"]
    command: ["/usr/local/bin/backup.sh"]
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-household_budget}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-budget_backup}
      APP_RELEASE: ${APP_RELEASE:-development}
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_repository_password
      RESTIC_CACHE_DIR: /tmp/restic-cache
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-12}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca_certificate
      PGSSLCERT: /run/secrets/postgres_backup_client_certificate
      PGSSLKEY: /run/secrets/postgres_backup_client_private_key
    secrets:
      - postgres_ca_certificate
      - postgres_backup_client_certificate
      - postgres_backup_client_private_key
      - restic_repository_password
    volumes:
      - type: bind
        source: ${BUDGET_BACKUP_REPOSITORY:-/mnt/household-budget-backups}
        target: /repository
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    user: postgres
    group_add:
      - ${BUDGET_SECRET_GID:-10002}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    logging: *log-policy

  restic-key-rotate:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
      dockerfile: deploy/backup/Dockerfile
    profiles: ["maintenance"]
    command: ["/usr/local/bin/rotate-restic-key.sh"]
    environment:
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_repository_password
      RESTIC_NEW_PASSWORD_FILE: /run/secrets/restic_repository_password_next
      RESTIC_CACHE_DIR: /tmp/restic-cache
    secrets:
      - restic_repository_password
      - restic_repository_password_next
    volumes:
      - type: bind
        source: ${BUDGET_BACKUP_REPOSITORY:-/mnt/household-budget-backups}
        target: /repository
        bind:
          create_host_path: false
    network_mode: none
    read_only: true
    user: postgres
    group_add:
      - ${BUDGET_SECRET_GID:-10002}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    logging: *log-policy

  integrity:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
    profiles: ["maintenance"]
    command: ["python", "manage.py", "write_audit_checkpoints"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.integrity
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-household_budget}
      POSTGRES_USER: ${POSTGRES_AUDIT_USER:-budget_audit}
      AUDIT_CHECKPOINT_SIGNING_KEY_FILE: /run/secrets/audit_checkpoint_signing_key
      AUDIT_CHECKPOINT_DIRECTORY: /checkpoints
      AUDIT_CHECKPOINT_KEY_ID: ${AUDIT_CHECKPOINT_KEY_ID:-home-v1}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      APP_RELEASE: ${APP_RELEASE:-development}
      POSTGRES_SSL_ROOT_CERTIFICATE_FILE: /run/secrets/postgres_ca_certificate
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca_certificate
      POSTGRES_SSL_CLIENT_CERTIFICATE_FILE: /run/secrets/postgres_integrity_client_certificate
      POSTGRES_SSL_CLIENT_PRIVATE_KEY_FILE: /run/secrets/postgres_integrity_client_private_key
      PGSSLCERT: /run/secrets/postgres_integrity_client_certificate
      PGSSLKEY: /run/secrets/postgres_integrity_client_private_key
    secrets:
      - postgres_ca_certificate
      - postgres_integrity_client_certificate
      - postgres_integrity_client_private_key
      - audit_checkpoint_signing_key
    volumes:
      - type: bind
        source: ${BUDGET_AUDIT_CHECKPOINT_DIRECTORY:-/mnt/household-budget-audit-checkpoints}
        target: /checkpoints
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    <<: *app-hardening
    logging: *log-policy

  notify:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
    profiles: ["maintenance"]
    command: ["python", "manage.py", "generate_notifications"]
    environment:
      <<: *app-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:-budget_runtime}
      POSTGRES_SSL_CLIENT_CERTIFICATE_FILE: /run/secrets/postgres_notify_client_certificate
      POSTGRES_SSL_CLIENT_PRIVATE_KEY_FILE: /run/secrets/postgres_notify_client_private_key
      PGSSLCERT: /run/secrets/postgres_notify_client_certificate
      PGSSLKEY: /run/secrets/postgres_notify_client_private_key
      BUDGET_BACKUP_STATUS_FILE: /repository/.last-success
      BUDGET_BACKUP_MAX_AGE_HOURS: ${BUDGET_BACKUP_MAX_AGE_HOURS:-36}
    secrets:
      - django_secret_key
      - django_mfa_encryption_key
      - postgres_ca_certificate
      - postgres_notify_client_certificate
      - postgres_notify_client_private_key
    volumes:
      - type: bind
        source: ${BUDGET_BACKUP_REPOSITORY:-/mnt/household-budget-backups}
        target: /repository
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    <<: *app-hardening
    logging: *log-policy

  import-cleanup:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
    profiles: ["maintenance"]
    command: ["python", "manage.py", "cleanup_stale_imports"]
    environment:
      <<: *app-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:-budget_runtime}
      POSTGRES_SSL_CLIENT_CERTIFICATE_FILE: /run/secrets/postgres_import_cleanup_client_certificate
      POSTGRES_SSL_CLIENT_PRIVATE_KEY_FILE: /run/secrets/postgres_import_cleanup_client_private_key
      PGSSLCERT: /run/secrets/postgres_import_cleanup_client_certificate
      PGSSLKEY: /run/secrets/postgres_import_cleanup_client_private_key
    secrets:
      - django_secret_key
      - django_mfa_encryption_key
      - postgres_ca_certificate
      - postgres_import_cleanup_client_certificate
      - postgres_import_cleanup_client_private_key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    <<: *app-hardening
    logging: *log-policy

  restore-verify:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
      dockerfile: deploy/backup/Dockerfile
    profiles: ["recovery"]
    command: ["/usr/local/bin/restore-verify.sh"]
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-household_budget}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-budget_admin}
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_repository_password
      RESTIC_CACHE_DIR: /tmp/restic-cache
      RESTORE_SNAPSHOT_ID: ${RESTORE_SNAPSHOT_ID:-latest}
      RESTORE_TARGET_DB: ${RESTORE_TARGET_DB:-}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca_certificate
      PGSSLCERT: /run/secrets/postgres_restore_verify_client_certificate
      PGSSLKEY: /run/secrets/postgres_restore_verify_client_private_key
    secrets:
      - postgres_ca_certificate
      - postgres_restore_verify_client_certificate
      - postgres_restore_verify_client_private_key
      - restic_repository_password
    volumes:
      - type: bind
        source: ${BUDGET_BACKUP_REPOSITORY:-/mnt/household-budget-backups}
        target: /repository
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    user: postgres
    group_add:
      - ${BUDGET_SECRET_GID:-10002}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    logging: *log-policy

  security-log:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
    restart: unless-stopped
    command: ["python", "-m", "core.security_log_collector", "serve"]
    network_mode: none
    volumes:
      - security_log_socket:/run/security-log
      - security_log_archive:/var/lib/security-log
    healthcheck:
      test: ["CMD", "python", "-m", "core.security_log_collector", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    user: "10003:10003"
    read_only: true
    init: true
    pids_limit: 32
    cpus: 0.5
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging: *log-policy

  ingress:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
      dockerfile: deploy/network/Dockerfile
    restart: unless-stopped
    entrypoint: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    user: "101:101"
    group_add:
      - ${BUDGET_SECRET_GID:-10002}
    read_only: true
    init: true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/network/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - gunicorn_ca_certificate
      - nginx_client_certificate
      - nginx_client_private_key
    depends_on:
      - web
    networks:
      - ingress
      - frontend
    logging: *log-policy

  web:
    build:
      context: ${BUDGET_BUILD_CONTEXT:-.}
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    environment:
      <<: *app-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:-budget_runtime}
      POSTGRES_SSL_CLIENT_CERTIFICATE_FILE: /run/secrets/postgres_web_client_certificate
      POSTGRES_SSL_CLIENT_PRIVATE_KEY_FILE: /run/secrets/postgres_web_client_private_key
      PGSSLCERT: /run/secrets/postgres_web_client_certificate
      PGSSLKEY: /run/secrets/postgres_web_client_private_key
    secrets:
      - django_secret_key
      - django_mfa_encryption_key
      - postgres_ca_certificate
      - postgres_web_client_certificate
      - postgres_web_client_private_key
      - gunicorn_client_ca_certificate
      - gunicorn_server_certificate
      - gunicorn_server_private_key
    command:
      - gunicorn
      - --config
      - python:config.gunicorn
      - config.wsgi:application
      - --workers
      - "2"
      - --error-logfile
      - "-"
      - --capture-output
    depends_on:
      db:
        condition: service_healthy
      security-log:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - type: volume
        source: security_log_socket
        target: /run/security-log
        read_only: true
    networks:
      - frontend
      - backend
    <<: *app-hardening
    logging: *log-policy

volumes:
  postgres_data:
  media_data:
  security_log_socket:
  security_log_archive:

networks:
  ingress:
  frontend:
    internal: true
  backend:
    internal: true

secrets:
  django_secret_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/django_secret_key
  django_mfa_encryption_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/django_mfa_encryption_key
  django_mfa_encryption_key_next:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/django_mfa_encryption_key.next
  postgres_ca_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_ca_certificate
  postgres_client_ca_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_client_ca_certificate
  postgres_server_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_server_certificate
  postgres_server_private_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_server_private_key
  postgres_db_bootstrap_client_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_db_bootstrap_client_certificate
  postgres_db_bootstrap_client_private_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_db_bootstrap_client_private_key
  postgres_migrate_client_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_migrate_client_certificate
  postgres_migrate_client_private_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_migrate_client_private_key
  postgres_mfa_key_rotate_client_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_mfa_key_rotate_client_certificate
  postgres_mfa_key_rotate_client_private_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_mfa_key_rotate_client_private_key
  postgres_backup_client_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_backup_client_certificate
  postgres_backup_client_private_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_backup_client_private_key
  postgres_integrity_client_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_integrity_client_certificate
  postgres_integrity_client_private_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_integrity_client_private_key
  postgres_notify_client_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_notify_client_certificate
  postgres_notify_client_private_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_notify_client_private_key
  postgres_import_cleanup_client_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_import_cleanup_client_certificate
  postgres_import_cleanup_client_private_key:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_import_cleanup_client_private_key
  postgres_restore_verify_client_certificate:
    file: ${BUDGET_SECRET_DIR:?Set BUDGET_SECRET_DIR}/postgres_restore_verify_client_certificate
